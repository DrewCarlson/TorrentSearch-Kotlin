name: Native

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  native-tests:
    strategy:
      matrix:
        os: [ macos-latest, windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Build files
        uses: actions/cache@v4
        if: ${{ !startsWith(matrix.os, 'windows') }}
        with:
          path: |
            ~/.konan
            ~/.gradle
          key: ${{ runner.os }}-${{ hashFiles('gradle.properties') }}
      - name: Setup WireGuard VPN (Linux)
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          sudo apt-get update && sudo apt-get install -y wireguard
          echo "${{ secrets.WG_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
      - name: Setup WireGuard VPN (macOS)
        if: ${{ startsWith(matrix.os, 'macos') }}
        run: |
          brew install wireguard-tools
          echo "${{ secrets.WG_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
      - name: Setup WireGuard VPN (Windows)
        if: ${{ startsWith(matrix.os, 'windows') }}
        shell: pwsh
        run: |
          choco install wireguard -y
          $wgConfig = "${{ secrets.WG_CONFIG }}"
          $wgPath = "C:\WireGuard\wg0.conf"
          New-Item -ItemType Directory -Force -Path "C:\WireGuard" | Out-Null
          $wgConfig | Out-File -FilePath $wgPath -Encoding utf8
          & "C:\Program Files\WireGuard\wireguard.exe" /installtunnelservice $wgPath
      - name: Test Windows Target
        if: ${{ startsWith(matrix.os, 'windows') }}
        run: ./gradlew mingwX64Test
      - name: Test Apple Targets
        if: ${{ startsWith(matrix.os, 'macos') }}
        run: ./gradlew macosX64Test # iosTest
      - name: Test Linux Target
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: ./gradlew linuxX64Test
